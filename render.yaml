# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → select zunaidhasan/CineVault
# Then fill in the `sync: false` env vars (see README "Deployment" section).

services:
  # ---- Backend: Express + Prisma REST API ----
  - type: web
    name: cinevault-api
    runtime: node
    plan: free
    rootDir: backend
    # migrate deploy is idempotent — safe to run on every build
    # (preDeployCommand is not supported on the free plan)
    # --include=dev: NODE_ENV=production makes npm skip devDependencies,
    # which include `prisma` (needed for generate/migrate).
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # ← paste your Neon connection string
      - key: JWT_SECRET
        sync: false # ← long random string, e.g. `openssl rand -hex 32`
      - key: FRONTEND_URL
        sync: false # ← https://cinevault-web.onrender.com
      - key: UPLOAD_DIR
        value: uploads
      - key: NODE_VERSION
        value: "22"

  # ---- Frontend: Next.js App Router (server-rendered, needs Node runtime) ----
  - type: web
    name: cinevault-web
    runtime: node
    plan: free
    rootDir: frontend
    # --include=dev: NODE_ENV=production makes npm skip devDependencies,
    # which include @tailwindcss/postcss + typescript (needed by the build).
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false # ← https://cinevault-api.onrender.com/api
      - key: NODE_VERSION
        value: "22"
