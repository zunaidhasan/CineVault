# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the Express + Prisma backend (the Next.js frontend runs on Vercel).
# Deploy: Render dashboard → New → Blueprint → select zunaidhasan/CineVault
# Then fill in the `sync: false` env vars (see README "Deployment" section).

services:
  # ---- Backend: Express + Prisma REST API ----
  - type: web
    name: cinevault-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: NODE_ENV=production makes npm skip devDependencies,
    # which include `prisma` (needed for generate/migrate).
    # migrate deploy is idempotent — safe to run on every build
    # (preDeployCommand is not supported on the free plan).
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # ← your Neon connection string
      - key: JWT_SECRET
        sync: false # ← long random string, e.g. `openssl rand -hex 32`
      - key: FRONTEND_URL
        sync: false # ← https://<your-project>.vercel.app (CORS allowlist)
      - key: UPLOAD_DIR
        value: uploads
      - key: NODE_VERSION
        value: "22"
